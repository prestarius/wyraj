gromnica:
  name: "gromnica candle"
  forms:
    pl: { mian: "gromnica", dop: "gromnicy", cel: "gromnicy", bier: "gromnicę", narz: "gromnicą", miej: "gromnicy" }
  glyph: "|"
  ascii_glyph: "|"
  style: "light_goldenrod2"
  kind: consumable
  effect: light
  power: 80
  spawn_weight: 3
  description: >
    A thunder-candle of blessed wax, lit against storms and against worse
    things. Unlit, it is only a promise — but even the promise is worth
    carrying in the dark under the trees.

wilczy_amulet:
  name: "wolf-tooth amulet"
  forms:
    pl: { mian: "wilczy amulet", dop: "wilczego amuletu", bier: "wilczy amulet", narz: "wilczym amuletem", miej: "wilczym amulecie" }
  glyph: "\""
  ascii_glyph: "\""
  style: "grey62"
  kind: trinket
  spawn_weight: 2
  description: >
    A yellowed fang on a leather cord, taken — the seller swore — from the
    lead wolf of a winter pack. Whether it wards off wolves or calls to
    them is a matter of some debate.

zurawie_pioro:
  name: "crane feather"
  glyph: "/"
  ascii_glyph: "/"
  style: "grey93"
  kind: consumable
  effect: crane
  power: 6
  spawn_weight: 0
  forms:
    pl: { mian: "żurawie pióro", dop: "żurawiego pióra", bier: "żurawie pióro", narz: "żurawim piórem", miej: "żurawim piórze" }
  description: >
    A long grey flight feather, warm to the touch in any weather. Birds are
    what pass between this world and Wyraj; hold the feather under open sky
    and a wedge of cranes will come down for you. They will not land while
    anything is watching.

szkaplerz:
  name: "szkaplerz of Weles"
  forms:
    pl: { mian: "szkaplerz Welesa", dop: "szkaplerza Welesa", cel: "szkaplerzowi Welesa", bier: "szkaplerz Welesa", narz: "szkaplerzem Welesa", miej: "szkaplerzu Welesa" }
  glyph: '"'
  ascii_glyph: '"'
  style: "medium_purple3"
  kind: trinket
  slot: amulet
  spawn_weight: 0
  description: >
    Two small squares of cloth on a woolen cord, one worn over the chest,
    one over the back. What is stitched inside is between the wearer and
    the god of the low places.
