noz:
  name: "skinning knife"
  forms:
    pl: { mian: "nóż do skórowania", dop: "noża do skórowania", bier: "nóż do skórowania", narz: "nożem do skórowania", miej: "nożu do skórowania" }
  glyph: ")"
  ascii_glyph: ")"
  style: "grey66"
  kind: weapon
  damage: 3
  spawn_weight: 4
  description: >
    A short, well-worn blade for hides and rope. It was never meant for
    what you will use it for, but it will not complain.

toporek:
  name: "woodsman's toporek"
  forms:
    pl: { mian: "toporek", dop: "toporka", cel: "toporkowi", bier: "toporek", narz: "toporkiem", miej: "toporku" }
  glyph: ")"
  ascii_glyph: ")"
  style: "grey78"
  kind: weapon
  damage: 5
  spawn_weight: 3
  description: >
    A hatchet with a scarred haft, ground to a working edge. Half the
    villages along the puszcza were raised with one of these; a few were
    defended with one, too.

ciupaga:
  name: "shepherd's ciupaga"
  glyph: ")"
  ascii_glyph: ")"
  style: "gold3"
  kind: weapon
  damage: 6
  spawn_weight: 2
  forms:
    en: { plural: "ciupagi" }
    pl: { mian: "ciupaga", dop: "ciupagi", cel: "ciupadze", bier: "ciupagę", narz: "ciupagą", miej: "ciupadze" }
  description: >
    A long-hafted highland axe, walking stick and weapon in one. The brass
    inlay on the head is worn smooth by a hand that is no longer here.
