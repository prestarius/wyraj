wilcza_skora:
  name: "wolfskin cloak"
  glyph: "["
  ascii_glyph: "["
  style: "grey54"
  kind: armor
  protection: 1
  spawn_weight: 3
  description: >
    A heavy pelt worn fur-out against the rain and claw-in against worse.
