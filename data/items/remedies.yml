odwar:
  name: "odwar of yarrow"
  glyph: "!"
  ascii_glyph: "!"
  style: "medium_purple3"
  kind: consumable
  effect: heal
  power: 8
  spawn_weight: 4
  forms:
    en: { article: "an", plural: "odwary" }
    pl: { mian: "odwar z krwawnika", dop: "odwaru z krwawnika", bier: "odwar z krwawnika", narz: "odwarem z krwawnika", miej: "odwarze z krwawnika" }
  description: >
    A bitter herbal decoction in a clay flask, brewed the way the old
    zielarki taught: yarrow, oak bark, and a whisper over the pot. It closes
    wounds faster than any barber's needle.

mocny_odwar:
  name: "black odwar"
  forms:
    pl: { mian: "czarny odwar", dop: "czarnego odwaru", bier: "czarny odwar", narz: "czarnym odwarem", miej: "czarnym odwarze" }
  glyph: "!"
  ascii_glyph: "!"
  style: "purple4"
  kind: consumable
  effect: heal
  power: 16
  spawn_weight: 2
  description: >
    Thick as tar and smelling of burnt honey. The zielarka who brewed it
    would not say what went into the pot, only that you should drink it
    with your eyes shut.

sol_swiecona:
  name: "blessed salt"
  forms:
    pl: { mian: "sól święcona", dop: "soli święconej", cel: "soli święconej", bier: "sól święconą", narz: "solą święconą", miej: "soli święconej" }
  glyph: "%"
  ascii_glyph: "%"
  style: "white"
  kind: consumable
  effect: bless
  power: 12
  spawn_weight: 3
  description: >
    A twist of linen holding salt blessed on Gromniczna. A pinch on the
    tongue steadies the soul and knits the flesh — a little. Its true work
    is against things that should not walk.

chleb:
  name: "loaf of dark bread"
  forms:
    pl: { mian: "bochen ciemnego chleba", dop: "bochna ciemnego chleba", bier: "bochen ciemnego chleba", narz: "bochnem ciemnego chleba", miej: "bochnie ciemnego chleba" }
  glyph: ","
  ascii_glyph: ","
  style: "tan"
  kind: consumable
  effect: feed
  power: 250
  spawn_weight: 4
  description: >
    Heavy rye bread, baked hard for the road. The bies hates the smell of
    it, the old people say. Good — more for you.

suszone_mieso:
  name: "strip of dried meat"
  forms:
    pl: { mian: "pas suszonego mięsa", dop: "pasa suszonego mięsa", bier: "pas suszonego mięsa", narz: "pasem suszonego mięsa", miej: "pasie suszonego mięsa" }
  glyph: ","
  ascii_glyph: ","
  style: "dark_orange3"
  kind: consumable
  effect: feed
  power: 400
  spawn_weight: 3
  description: >
    Smoked over a juniper fire until it bends like leather. Chewing it
    takes half a day and gives you something to think about other than
    the sounds between the trees.
