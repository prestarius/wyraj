# Errand templates (M10 "Zlecenia" §1). 1-3 are drawn per run, at most one
# per giver, weighted, deterministic per (seed, meta). Rewards are paid into
# the banked wallet; reputation goes to meta.villagers by giver role.
# A fate is the village flag that resolves after `patience` ignored runs.

syn_mlynarza:
  giver: mlynarz
  kind: hunt
  target: utopiec
  proof: utopcowa_luska
  depth: 2
  reward: { denary: 70, reputation: 1 }
  patience: 3
  fate: mlyn_pusty
  weight: 3

