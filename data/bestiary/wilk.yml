wilk:
  name: "wilk"
  glyph: "w"
  ascii_glyph: "w"
  style: "grey54"
  hp: 6
  speed: 120
  damage: 2
  to_hit: 70
  behavior: approach
  spawn_weight: 4
  epithets: ["grey brother", "shadow of the treeline"]
  forms:
    en: { plural: "wilki" }
  description: >
    A forest wolf, lean with the hungry months. One alone watches and
    follows and weighs you; the trouble is that a wilk is rarely alone.
    Hunters leave the first kill of the season at the treeline for them,
    and do not talk about why.
