  strzyga: { file: voices/strzyga.wav, volume: 0.7 }
  martwiak: { file: voices/martwiak.wav, volume: 0.65 }
  bies: { file: voices/bies.wav, volume: 0.7 }
  utopiec: { file: voices/utopiec.wav, volume: 0.65 }
