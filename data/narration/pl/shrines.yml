shrine_visited:
  perun:
    - weight: 2
      pl: "Kapliczka Peruna: dębowy słup poznaczony piorunami, żelazne gwoździe wbite rzędami. Powietrze pachnie burzami, których jeszcze nie było."
    - weight: 1
      pl: "Słup Peruna patrzy w niebo, jak żołnierz patrzy na drogę. Ofiara nie przeszłaby niezauważona."
  weles:
    - weight: 2
      pl: "Kapliczka Welesa przycupnęła nisko, w połowie w cieniu, owinięta wełną i starymi rogami. Bóg zaświatów trzyma tu swoje drzwi — i swój rejestr."
    - weight: 1
      pl: "Monety, rogi i spodeczek skwaśniałego mleka: Weles zbiera po cichu. Mówią, że pamięta o tych, którzy płacą."

offering_made:
  perun:
    - weight: 1
      importance: high
      pl: "Składasz {cost} denarów u słupa Peruna. Daleko, w pogodny dzień, coś grzmi — a twoje ręce już są pewniejsze."
  weles:
    - weight: 1
      importance: high
      pl: "Zostawiasz {cost} denarów w misie Welesa. Cień pod kapliczką pogłębia się z aprobatą. Ziemia będzie hojniejsza ze swoimi umarłymi."
