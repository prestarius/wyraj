  blessing:
    - weight: 1
      pl: "Błogosławieństwo gaśnie, cicho jak dym świecy."

light_extinguished:
  - weight: 1
    importance: high
    pl: "Gromnica pryska, bucha raz płomieniem i gaśnie. Ciemność podchodzi o krok bliżej."
