talked_to:
  innkeeper:
    - weight: 2
      tags: [known_face]
      pl: "Dobrava stawia przed tobą miskę, zanim zdążysz poprosić. „Siadaj. Ten dom ma u ciebie dług, a ten dom płaci długi, zanim się o nie upomną.”"
    - weight: 2
      pl: "Dobrava, karczmarka, mierzy cię wzrokiem jak zmokłego psa na progu. „Jest łóżko i jest ogień, wędrowcze. Odpoczywaj, póki odpoczynek darmowy.”"
    - weight: 1
      pl: "„Zjedz coś” — mówi karczmarka tonem kobiety, która grzebała już takich, co nie zjedli."
  trader:
    - weight: 2
      tags: [known_face]
      pl: "Miłosz nie sięga po wagę, kiedy podchodzisz. „Dla ciebie? Ceny uczciwe. Tylko nie mów wsi, że trzymam dwa cenniki.”"
    - weight: 2
      pl: "Miłosz, handlarz, rozkłada towar szerokim gestem. „Rzecz za rzecz, przyjacielu. Moneta jest dla miast; tu, na końcu świata, płaci się tym, co użyteczne.”"
    - weight: 1
      pl: "Handlarz zerka na twój tobołek. „Wszystko ma cenę. Tutaj ceną bywa zwykle to, czego ci później zabraknie.”"
  gossip:
    - weight: 2
      tags: [known_face]
      pl: "Stary Świętosław nie mówi już do ciebie „wędrowcze”. „Wieś gada o tobie pod kościelnymi drzwiami” — powiada. — „Pierwszy raz gada po twojej stronie.”"
    - weight: 2
      pl: "Stary Świętosław opiera się na kiju. „Strzyga liczy twoje noce, wędrowcze. Trzy patrzy, czwartej przychodzi. Pilnuj ognia.”"
    - weight: 2
      pl: "„Utopiec daleko od topieli nie zajdzie” — mruczy dziad. „Na suchym mchu jest powolny. Pamiętaj o tym, kiedy woda zacznie źle pachnieć.”"
    - weight: 2
      pl: "„Sól z Gromnicznej pali niepogrzebanych jak żelazo” — mówi stary. „Martwiak niczego innego się nie boi. Nawet ciebie.”"
    - weight: 2
      pl: "Dziad spluwa przez ramię. „Zobaczysz małe, jednookie? Nie goń. Cokolwiek ci wzięło, pogoń będzie kosztować więcej.”"
    - weight: 1
      pl: "„Wilki to nie jest niebezpieczeństwo” — mówi Świętosław. — „Wilki to ostrzeżenie. Jak przebiegną obok ciebie, biegnij z nimi.”"
    - weight: 1
      pl: "„Pod kurhanami ciemność jest starsza od ognia” — szepcze stary. „Weź gromnicę. Weź dwie.”"
    - weight: 1
      pl: "„Światełka nad bagnami to dusze” — powiada. „Czyje? Idź za nimi, to się dowiesz. Nie? Mądrze.”"
    - weight: 3
      tags: [fate_mlyn_pusty]
      pl: "„Młyn stoi teraz pusty” — mówi Świętosław i zostawia to tak, bo dodać nie ma czego, a na czyje słowo młyn czekał, wiecie oboje."
    - weight: 3
      tags: [fate_ciemna_kapliczka]
      pl: "„Nad kapliczką nie ma dymu” — mówi dziad, nie patrząc na ciebie. „Bogowie też prowadzą rachunki, wędrowcze. Porządniejsze od moich.”"
    - weight: 3
      tags: [fate_zimna_kuznia]
      pl: "„Od teraz noś przy sobie osełkę” — mówi Świętosław. „Kuźnia zimna. Radzim zmęczył się obietnicami — naszymi i twoimi.”"
  kowal:
    - weight: 2
      tags: [known_face]
      pl: "Radzim wita cię tak, jak wita dobre żelazo — po imieniu i robiąc miejsce przy palenisku. U kowala to jest święto."
    - weight: 2
      pl: "Radzim, kowal, podnosi wzrok znad kowadła, uznaje, że nie jesteś ani robotą, ani pogodą, i kiwa głową. Raz. Więcej mało kto dostaje."
    - weight: 1
      pl: "Kowal obraca podkowę w węglach. „Jak ci trzeba ostrza, to sprzedam. Jak rady — ostrze tańsze, a warte więcej.”"
  mlynarz:
    - weight: 2
      tags: [known_face]
      pl: "Bogusz prostuje się na twój widok i przez jedno uderzenie serca znów ma w twarzy młynarza, nie tylko ojca. „Ty” — mówi, a znaczy to: dziękuję."
    - weight: 2
      pl: "Bogusz, młynarz, stoi z mąką na rękawach i oczami przy bramie. Młynarzy liczono tu kiedyś do bogatych. On już niczego nie liczy."
    - weight: 1
      pl: "„Strumień dalej obraca koło” — mówi młynarz, do ciebie albo do siebie. „Koło nie pyta, co się stało. To w kole najlepsze.”"

rested:
  - weight: 2
    pl: "Śpisz za karczemnym ogniem i przez jedną noc las zostaje po drugiej stronie ściany. Budzisz się cały."
  - weight: 1
    pl: "Słoma, dym i pomruk wsi za ścianą — śpisz jak zabity, a w przeciwieństwie do zabitych wstajesz."

item_bought:
  - weight: 2
    pl: "Odliczasz {price} denarów i bierzesz {item.name.bier}. Handlarz sprawia, że srebro znika jak u kuglarza."
  - weight: 1
    pl: "{item.name.Mian} zmienia właściciela za {price} denarów. Obie strony udają, że cena była uczciwa."

item_sold:
  - weight: 2
    pl: "Handlarz obraca {item.name.bier} dwa razy w palcach, wącha i odlicza {price} denarów."
  - weight: 1
    pl: "Twój {item.name.mian} wędruje na wóz za {price} denarów. Ma przed sobą dłuższą drogę niż ty."

coins_picked:
  - weight: 2
    pl: "Zbierasz z ziemi {amount} denarów. Srebro nie pamięta właścicieli i to jest w nim najłaskawsze."
  - weight: 1
    pl: "{amount} denarów, zimnych i uczciwych, wpada do sakiewki."

coins_banked:
  - weight: 2
    pl: "Odliczasz {amount} denarów do karczemnej skrzyni. Cokolwiek las ci teraz zabierze, tego nie zabierze."
  - weight: 1
    pl: "Srebro chowa się za żelazne wieko Dobravy — {amount} denarów, o które puszcza nie ma już prawa się spierać."
