wygnaniec:
  name: "Wygnaniec"
  title: "the Exile"
  hp: 24
  to_hit: 75
  damage: 4
  satiation: 500
  starting_items: [noz, chleb]
  title_pl: "Banita"
  intro_pl: >
    Wyrok odczytali ci u drzwi kościoła i stłukli glinianą misę o próg.
    Cokolwiek zrobiłeś — a wieś spiera się o to do dziś — puszcza jest
    teraz twoją ojczyzną. Przetrwałeś w niej już jedną zimę. To o jedną
    więcej, niż udaje się większości wygnańców.
  description_pl: >
    Twardszy niż inni (24 zdrowia), oswojony z pierwszym ukąszeniem głodu,
    ale wieś nie jest ci nic winna. Zaczynasz z nożem i bochnem kradzionego
    chleba.
  intro: >
    They read your sentence at the church door and broke a clay bowl over
    the threshold. Whatever you did — and the wieś argues about it still —
    the puszcza is your country now. You have survived one winter in it
    already. That is one more than most exiles manage.
  description: >
    Hardier than most (24 HP), inured to hunger's first bite, but the
    village owes you nothing. Starts with a knife and a loaf of stolen bread.

zielarka:
  name: "Zielarka"
  title: "the Herbwoman"
  hp: 18
  to_hit: 70
  damage: 3
  satiation: 600
  starting_items: [odwar, odwar, sol_swiecona, gromnica]
  title_pl: "Zielarka"
  intro_pl: >
    Znasz puszczę tak, jak pleban zna swój psałterz — która kora uciszy
    gorączkę, który mech opatrzy ranę i z których polan trzeba odejść
    przed zmierzchem. Ale coś w lesie zmieniło zwyczaje, a zioła, których
    potrzebujesz, rosną już tylko tam, gdzie ono poluje.
  description_pl: >
    Wątła (18 zdrowia), lecz nigdy bez leków. Zaczynasz z dwoma odwarami,
    solą święconą i gromnicą.
  intro: >
    You know the puszcza the way the priest knows his psalter — which bark
    quiets a fever, which moss packs a wound, and which clearings to leave
    before dusk. Now something in the forest has changed its habits, and
    the herbs you need grow only where it hunts.
  description: >
    Frail (18 HP) but never without remedies. Starts with two odwary,
    blessed salt, and a gromnica candle.

najemnik:
  name: "Najemnik"
  title: "the Sellsword"
  hp: 20
  to_hit: 80
  damage: 4
  satiation: 550
  starting_items: [toporek, wilcza_skora]
  title_pl: "Najemnik"
  intro_pl: >
    Biłeś się pod trzema chorągwiami i przeżyłeś wszystkich trzech
    płatników. Srebro w tej wsi jest cienkie, ale robota jak na twoje
    standardy uczciwa: coś porywa ludzi z brzegu lasu, a wieś wykarmi
    każdego, kto sprawi, że przestanie.
  description_pl: >
    Wprawny zabójca (20 zdrowia, pewna ręka w walce). Zaczynasz
    z toporkiem i wilczą skórą.
  intro: >
    You fought for three banners and outlived all three paymasters. The
    silver in this village is thin, but the work is honest by your
    standards: something is taking people from the edge of the woods, and
    the wieś will feed whoever makes it stop.
  description: >
    A practiced killer (20 HP, sure-handed in a fight). Starts with a
    woodsman's toporek and a wolfskin cloak.
