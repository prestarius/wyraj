# M8 §3 — three endings, prologue-format pages. Selection: gospodarz
# (dziad befriended) > ptaki (codex/favor) > swit (default). One run earns one.
endings:
  swit:
    - >
      The stairs take longer going up. That is not how stairs work, the
      living part of you insists, and the rest of you knows better: the
      dark is reluctant to give anything back, and you are the first thing
      it has lost in a long while.


      You count your candle-stubs. You do not count the days.
    - >
      There is a morning somewhere above the third landing. You smell it
      before you see it — wet bark, cold ash, the particular green of
      leaves that have never once considered you. When you finally step
      out under the sky it is raining, thin and unhurried, and you stand
      in it until your hands stop being stone.


      The puszcza does not thank you. The puszcza does not know. That is
      the whole point of what you did, and you find you can live with it.
    - >
      They read your sentence at the church door once, and broke a clay
      bowl over the threshold. When you walk into the wieś now, nobody
      reads anything. They argue about you at the church door instead —
      about where you went, about what stopped scratching under the hills
      that night, about why the dogs sleep.


      Let them argue. The lids stayed shut. You are going to sleep for a
      week, and for once, nothing is going to watch you do it.
  gospodarz:
    - >
      You come up the last stairs and the cart is there. It cannot be
      there. There is no road, no door wide enough, no honest way for a
      cart to stand at the bottom of the third landing with its lantern
      already lit — and there it is, and there he is, and he is not
      surprised. He is never surprised.


      "Sit," says the dziad. "You have earned riding."
    - >
      The cart climbs through the dark without a horse and without a
      sound, and the old man talks the whole way — not about the cradle,
      not about the salt still burning in the creases of your palms, but
      about prices. What things cost. What they used to cost. What you
      have just made more expensive, and for whom.


      "The deep will be poorer without him watching it," he says, and it
      is the closest thing to thank-you the dziad has ever said to anyone.
    - >
      He sets you down at the edge of the wieś, where the fence has a gap
      that was always there for exactly this. You want to ask what he is.
      You have earned the question. He looks at you with his lantern eyes
      and you decide — carefully, deliberately, the way you pressed the
      lids — that you would rather keep the mystery than spend it.


      "I will see you below," says the dziad, and the cart is gone, and
      for once that sounds like a kindness.
  ptaki:
    - >
      You are still kneeling at the cradle, hands flat on the sealed
      stone, when you hear it: wings. Not above the hill — under it. In
      it. The sound a roof makes when it decides, after long thought, to
      be a sky.


      The cranes come down through the barrow as if stone were weather.
    - >
      They know you. That is the strangest part — not the flight, not the
      dark opening like water; the knowing. Every bird in the wedge has
      counted your nights, your candles, the names you learned and the
      names you gave. Knowledge is a kind of open sky, and you have made
      yourself so known to this land that its birds can find you anywhere.


      They lift you the way they lift the dead, and you are not dead, and
      they seem pleased by the novelty.
    - >
      They set you down on the żerdź at dawn, in front of the whole wieś,
      which will now believe absolutely anything you say for the rest of
      your life. The wedge circles once — a slow ring over the roofs, a
      crown lent rather than given — and turns toward Wyraj without you.


      Not yet, the wings say. You have a country now. Wear it out first.
