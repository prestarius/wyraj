- "Ptaki znają drogę. Ptaki zawsze znały."
- "Każda dusza wraca. Nie każda wraca taka sama."
- "Za dziewiątym lasem, za dziewiątą rzeką."
- "Co odchodzi do Wyraju, wraca na wiosnę. Przeważnie."
- "Wieś nie zadaje pytań. Pytania przyzywają odpowiedzi."
- "Pod kurhanami ciemność jest starsza od ognia."
