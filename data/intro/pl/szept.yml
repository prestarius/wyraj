first_move: "We wsi cicho. Ogień u kowala przygaszony, drzwi handlarza otwarte. (ruch: strzałki albo hjkl; ? pokazuje resztę)"
first_hostile: "(wpadnij na stwora, by go uderzyć)"
hp_low: "(rany leczy odpoczynek i leki — ucieczka to tu nie tchórzostwo)"
first_hunger: "(masz jedzenie przy sobie; i otwiera tobołek)"
first_darkness: "(światło ma znaczenie: gromnice płoną, a niektóre rzeczy się ich boją)"
item_on_floor: "(g podnosi to, co leży u twoich stóp)"
forest_edge: "Puszcza zaczyna się tam, gdzie kończą się płoty. Za pierwszymi drzewami nikt cię nie usłyszy. (> schodzi w dół. Temu, co schodzi, nikt nie obiecuje drogi powrotnej)"
first_status: "(panel postaci pokazuje, co cię trapi)"
first_kill: "(x przygląda się; kodeks zapamiętuje, czego się uczysz)"
farewell: "Szepty milkną; znasz już ten świat."
deep_descended: "Odtąd w dół nie ma nieba. Szept, któremu dotąd ufano, nic już nie mówi — teraz nasłuchuje."
wij_watching: "Ono wie, że gromnica dopaliła się do połowy. Ty też to wiesz."
