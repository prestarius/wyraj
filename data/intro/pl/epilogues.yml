# M8 §3 — trzy zakończenia, strony w formacie prologu. Pisane po polsku
# od zera, nie tłumaczone — te same uderzenia, własny oddech.
endings:
  swit:
    - >
      Schody w górę trwają dłużej. Tak schody nie działają, upiera się
      w tobie to, co żywe — a reszta ciebie wie lepiej: ciemność niechętnie
      cokolwiek oddaje, a ty jesteś pierwszym, co jej przepadło od bardzo
      dawna.


      Liczysz ogarki gromnic. Dni nie liczysz.
    - >
      Gdzieś nad trzecim podestem jest ranek. Czujesz go, zanim go
      zobaczysz — mokra kora, zimny popiół, ta szczególna zieleń liści,
      które ani razu nie pomyślały o tobie. Kiedy wreszcie wychodzisz pod
      niebo, pada — drobno, bez pośpiechu — i stoisz w tym deszczu, aż
      dłonie przestają być kamieniem.


      Puszcza nie dziękuje. Puszcza nie wie. Po to właśnie było to
      wszystko — i okazuje się, że umiesz z tym żyć.
    - >
      Raz odczytano ci wyrok u drzwi kościoła i stłuczono glinianą misę na
      progu. Teraz, gdy wchodzisz do wsi, nikt niczego nie odczytuje. Za to
      kłócą się o ciebie u tych samych drzwi — dokąd cię poniosło, co tamtej
      nocy przestało skrobać pod wzgórzami, czemu psy śpią.


      Niech się kłócą. Powieki zostały zamknięte. Idziesz spać na tydzień
      i pierwszy raz nic nie będzie na to patrzeć.
  gospodarz:
    - >
      Wychodzisz na ostatnie schody, a wóz tam stoi. Nie może tam stać.
      Nie ma drogi, nie ma dość szerokich drzwi, nie ma uczciwego sposobu,
      żeby wóz czekał u stóp trzeciego podestu z zapaloną już latarnią —
      a jednak stoi, i on przy nim stoi, i wcale nie jest zdziwiony. On
      nigdy nie jest zdziwiony.


      — Siadaj — mówi dziad. — Jazdę masz zapłaconą.
    - >
      Wóz wspina się przez ciemność bez konia i bez dźwięku, a stary gada
      całą drogę — nie o kolebce, nie o soli, która jeszcze piecze w
      bruzdach twoich dłoni, tylko o cenach. Co ile kosztuje. Co ile
      kosztowało. Co właśnie podrożało — i dla kogo.


      — Głębia będzie bez niego uboższa — mówi, i to jest najbliższe
      dziękuję, jakie dziad komukolwiek w życiu powiedział.
    - >
      Wysadza cię na skraju wsi, tam gdzie płot ma wyrwę, która zawsze
      była właśnie na to. Chcesz zapytać, czym on jest. Zasłużyłeś na to
      pytanie — a jednak patrzysz w te jego latarniane oczy i postanawiasz,
      ostrożnie, z rozmysłem, tak jak przyciskało się powieki: wolisz
      tajemnicę zachować, niż ją wydać.


      — Do zobaczenia na dole — mówi dziad, i wozu już nie ma, i pierwszy
      raz brzmi to jak dobre słowo.
  ptaki:
    - >
      Wciąż klęczysz przy kolebce, z dłońmi płasko na zapieczętowanym
      kamieniu, kiedy to słyszysz: skrzydła. Nie nad wzgórzem — pod nim.
      W nim. Taki dźwięk wydaje strop, który po długim namyśle postanawia
      być niebem.


      Żurawie schodzą przez kurhan, jakby kamień był tylko pogodą.
    - >
      One cię znają. To jest najdziwniejsze — nie lot, nie ciemność
      otwierająca się jak woda; to znanie. Każdy ptak w kluczu policzył
      twoje noce, twoje świece, imiona, których się nauczyłeś, i te, które
      nadałeś. Wiedza jest rodzajem otwartego nieba — a ty dałeś się tej
      ziemi poznać tak dobrze, że jej ptaki znajdą cię wszędzie.


      Unoszą cię tak, jak unosi się zmarłych, a ty nie jesteś martwy,
      i chyba cieszy je ta nowość.
    - >
      Stawiają cię na żerdzi o świcie, na oczach całej wsi, która od dziś
      do końca twojego życia uwierzy ci absolutnie we wszystko. Klucz
      zatacza jedno koło — powolny pierścień nad dachami, korona
      pożyczona, nie darowana — i skręca ku Wyrajowi bez ciebie.


      Jeszcze nie, mówią skrzydła. Masz teraz kraj. Najpierw go znoś.
